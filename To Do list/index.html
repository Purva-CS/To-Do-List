<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="todo-container">
    <h2>To-Do List  📝</h2>

    
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn"><h3>ADD</h3></button>
    </div>

    
    <div class="filters">
      <div class="style"><button class="filter-btn active" data-filter="all"><h3>ALL</h3></button></div>
      <div class="style"><button class="filter-btn" data-filter="pending"><h3>PENDING</h3></button></div>
      <div class="style"><button class="filter-btn" data-filter="completed"><h3>COMPLETED</h3></button></div>
    </div>

    
    <ul id="taskList"></ul>

    
    <div class="stats">
      <span id="pendingCount">Pending: 0</span>
      <span id="completedCount">Completed: 0</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
